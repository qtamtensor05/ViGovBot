model:
  name: Qwen/Qwen2.5-7B-Instruct
  trust_remote_code: false
  max_seq_length: 2048
data:
  splits:
    train: Data/tthc_test_case_v1/data/train_sft.jsonl
    validation: Data/tthc_test_case_v1/data/validation_sft.jsonl
    test: Data/tthc_test_case_v1/data/test_sft.jsonl
  output_dir: outputs/qlora
  near_duplicate_threshold: 0.92
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
training:
  num_train_epochs: 5
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  seed: 42
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
early_stopping:
  enabled: true
  patience: 2
  threshold: 0.001
evaluation:
  generation:
    max_new_tokens: 512
    temperature: 0.0
reporting:
  tensorboard: true
  save_csv: true
  save_json: true
  generate_plots: true
execution:
  approved: false
  max_samples: null
  max_steps: -1
