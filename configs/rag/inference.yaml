data:
  unified_source: ../../Data/vector/unified
  cache_dir: ../../outputs/rag_cache
  allow_legacy_corpus: false
embedding:
  model: BAAI/bge-m3
  revision: null  # Resolved from the verified corpus manifest.
  device: cuda  # V100 32 GB can keep the query encoder beside quantized Qwen.
llm:
  model: qwen2.5:7b
  ollama_url: &ollama_url http://localhost:11434
  num_ctx: 16384
  num_predict: 2048
retrieval:
  top_k: 5
  max_chunk_tokens: 1200
  max_metadata_tokens: 256
conversation:
  routing_backend: phobert
  routing_phobert_path: ../../model/phobert_v3_finetuned_20261028/runtime/checkpoint
  routing_phobert_threads: 2
web:
  debug_routing: false  # Bật để xem raw JSON router trong API/UI khi chẩn đoán.
  models:
    - id: qwen-base
      label: Qwen 2.5 7B — Base (không RAG)
      provider: ollama
      model: qwen2.5:7b
      base_url: *ollama_url
      mode: base
    - id: qwen-rag
      label: Qwen 2.5 7B + RAG
      provider: ollama
      model: qwen2.5:7b
      base_url: *ollama_url
      mode: rag
    - id: qwen-qlora
      label: Qwen 2.5 7B + QLoRA v2 (không RAG)
      provider: ollama
      model: qwen-qlora-rag-sft:latest
      base_url: *ollama_url
      mode: qlora
    - id: qwen-rag-qlora
      label: Qwen 2.5 7B + RAG + QLoRA v2
      provider: ollama
      model: qwen-qlora-rag-sft:latest
      base_url: *ollama_url
      mode: rag
    # Ví dụ API chuẩn OpenAI-compatible:
    # - id: model-api
    #   label: Model qua API
    #   provider: openai_compatible
    #   model: ten-model-tren-api
