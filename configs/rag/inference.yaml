data:
  unified_source: ../../Data/vector/unified
  cache_dir: ../../outputs/rag_cache
  allow_legacy_corpus: false
embedding:
  model: BAAI/bge-m3
  revision: null  # Resolved from the verified corpus manifest.
  device: cpu
llm:
  model: qwen2.5:7b
  ollama_url: &ollama_url http://localhost:11434
web:
  debug_routing: false  # Bật để xem raw JSON router trong API/UI khi chẩn đoán.
  models:
    - id: qwen-base
      label: Qwen 2.5 7B — Base (không RAG)
      provider: ollama
      model: qwen2.5:7b
      base_url: *ollama_url
      mode: base
    - id: qwen-rag
      label: Qwen 2.5 7B + RAG
      provider: ollama
      model: qwen2.5:7b
      base_url: *ollama_url
      mode: rag
    - id: qwen-qlora
      label: Qwen 2.5 7B + QLoRA
      provider: local_transformers
      model: Qwen/Qwen2.5-7B-Instruct
      base_url: local
      mode: qlora
      adapter_path: ../../outputs/qlora/best_adapter
      load_in_4bit: true
      allow_multiple_models: false
      cpu_offload: false
      force_single_gpu: true
    # Ví dụ API chuẩn OpenAI-compatible:
    # - id: model-api
    #   label: Model qua API
    #   provider: openai_compatible
    #   model: ten-model-tren-api
