extends: gpu.yaml
# Native Windows configuration verified on RTX 5060 Ti 16 GB (SM 12.0).
data:
  splits:
    train: Data/tthc_test_case_v1/data/fintuning/train_sft.jsonl
    validation: Data/tthc_test_case_v1/data/fintuning/validation_sft.jsonl
    test: Data/tthc_test_case_v1/data/fintuning/test_sft.jsonl
model:
  max_seq_length: 2048
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16
lora:
  r: 16
  alpha: 32
  dropout: 0.05
training:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 0.0002
  num_train_epochs: 5
  optim: paged_adamw_8bit
early_stopping:
  enabled: true
  patience: 2
  threshold: 0.001

