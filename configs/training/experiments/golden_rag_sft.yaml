extends: ../base.yaml
model:
  # Optimized for RTX 5060 Ti 16 GB: 96.6% of clean RAG-SFT data fits within 2048 tokens,
  # keeping peak VRAM under 14 GB and eliminating PCIe paging and CUDA OOM.
  max_seq_length: 2048
data:
  splits:
    train: Data/dataset_v3/finetuning_rag_clean/train_rag_sft_2048.jsonl
    validation: Data/dataset_v3/finetuning_rag_clean/validation_rag_sft_2048.jsonl
    test: null
training:
  num_train_epochs: 3
  learning_rate: 0.00005
execution:
  approved: true
  artifact_label: golden_rag_sft
