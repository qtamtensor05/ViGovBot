data:
  unified_source: ../Data/vector/unified
  cache_dir: ../outputs/rag_cache
  allow_legacy_corpus: false
embedding:
  model: BAAI/bge-m3
  revision: null  # Resolved from the verified corpus manifest.
  device: cpu
llm:
  model: qwen2.5:7b
  ollama_url: http://localhost:11434
web:
  models:
    - id: qwen-base
      label: Qwen 2.5 7B — Base (không RAG)
      provider: ollama
      model: qwen2.5:7b
      base_url: http://localhost:11434
      mode: base
    - id: qwen-rag
      label: Qwen 2.5 7B + RAG
      provider: ollama
      model: qwen2.5:7b
      base_url: http://localhost:11434
      mode: rag
