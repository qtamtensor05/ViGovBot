name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test,dev]"
      - run: python -m pip check
      - run: python -m ruff check src/vigovbot scripts tests main.py colab_worker_embed.py merge_vector_packs.py
      - run: python -m ruff check --select S src/vigovbot
      - run: python -m ruff format --check src/vigovbot scripts tests main.py colab_worker_embed.py merge_vector_packs.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_colab_notebooks.py
      - run: git diff --exit-code -- ipynb
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python scripts/check_wheel.py
