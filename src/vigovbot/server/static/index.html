<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ViGovBot Model Lab</title>
  <style>
    :root{color-scheme:light;--ink:#17342d;--muted:#60736d;--brand:#087f5b;--paper:#fff;--bg:#edf5f1;--line:#d7e5df}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e4f1eb,#f7f4ea);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
    main{width:min(1100px,calc(100% - 24px));height:100dvh;margin:auto;padding:24px 0;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px}
    header,section,form{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px #245b4520}
    header{padding:18px 22px}h1{font-size:1.35rem;margin:0}header p{margin:3px 0 0;color:var(--muted)}#new-chat{float:right;min-height:36px;margin:0 0 8px 12px}
    #models{padding:12px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}#models label{display:flex;gap:6px;align-items:center}.provider{color:var(--muted);font-size:.78rem}
    #chat{overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}.msg{max-width:84%;padding:11px 14px;border-radius:14px;white-space:pre-wrap}
    .user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}.bot{align-self:flex-start;background:#f0f5f2;border:1px solid var(--line);border-bottom-left-radius:4px}
    .answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.answer{background:#f0f5f2;border:1px solid var(--line);border-radius:14px;padding:14px;white-space:pre-wrap}.answer h2{font-size:.95rem;margin:0 0 8px;color:var(--brand)}
    .contexts{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;white-space:normal}.contexts>summary{cursor:pointer;color:var(--brand);font-weight:700}.context-list{display:grid;gap:9px;margin-top:9px}.context{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px}.context h3{font-size:.86rem;margin:0 0 4px}.context .context-meta{font-size:.75rem;color:var(--muted);margin-bottom:7px}.context pre{margin:0;max-height:260px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
    .meta{font-size:.8rem;color:var(--muted);margin-top:7px}.empty{margin:auto;color:var(--muted);text-align:center}
    form{padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px}textarea{resize:none;border:1px solid #b9cec5;border-radius:11px;padding:11px;font:inherit;min-height:50px;max-height:150px}
    button{border:0;border-radius:11px;padding:0 22px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    @media(max-width:600px){main{padding:10px 0}.msg{max-width:94%}form{grid-template-columns:1fr}button{height:44px}}
</style>
</head>
<body><main>
  <header><button id="new-chat" type="button">Hội thoại mới</button><h1>ViGovBot Model Lab</h1><p>So sánh Qwen Base, Qwen + RAG và Qwen đã tinh chỉnh QLoRA</p></header>
  <section id="models"><strong>Model:</strong><span>Đang tải…</span></section>
  <section id="chat"><div class="empty">Nhập câu hỏi để bắt đầu.</div></section>
  <form id="form"><textarea id="question" rows="1" placeholder="Ví dụ: Hồ sơ cấp bản sao hộ tịch gồm những gì?" required></textarea><button id="send">Gửi</button></form>
</main><script>
const chat=document.querySelector('#chat'),modelsEl=document.querySelector('#models'),form=document.querySelector('#form'),input=document.querySelector('#question'),button=document.querySelector('#send');
const histories={},retrievalContexts={},clarificationContexts={},conversationStates={};let modelInfo={};
function add(text,kind,meta=''){chat.querySelector('.empty')?.remove();const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;el.appendChild(m)}chat.appendChild(el);chat.scrollTop=chat.scrollHeight}
function modeLabel(mode){return {base:'không truy hồi',rag:'có truy hồi',qlora:'adapter QLoRA · không truy hồi'}[mode]||mode}
async function loadModels(){try{const res=await fetch('/api/models'),data=await res.json();if(!res.ok)throw new Error(data.error);modelsEl.innerHTML='<strong>Chế độ:</strong>';for(const m of data.models){modelInfo[m.id]=m;histories[m.id]=[];retrievalContexts[m.id]=null;clarificationContexts[m.id]=null;conversationStates[m.id]=null;const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.value=m.id;box.checked=true;label.append(box,document.createTextNode(m.label+' '));const p=document.createElement('span');p.className='provider';p.textContent=`(${modeLabel(m.mode)})`;label.append(p);modelsEl.append(label)}}catch(err){modelsEl.textContent='Không tải được chế độ: '+err.message}}
function routingStatus(d){if(!d)return '';if(d.fallback_reason)return `Lỗi định dạng phân loại sau ${d.routing_attempts} lần · trả câu mặc định`;const reasons={ambiguous_question:'Cần làm rõ câu hỏi',procedure_required:'Cần chọn thủ tục',section_required:'Cần chọn nội dung',out_of_scope:'Ngoài phạm vi hỗ trợ',no_context:'Chưa có tài liệu để trả lời',evidence_assessment:'Đã xét bằng chứng tài liệu'};return [reasons[d.decision_reason]||'',d.relation?`Nhãn: ${d.relation}`:'',d.routing_attempts?`Phân loại: ${d.routing_attempts} lần`:''].filter(Boolean).join(' · ')}
function historyAnswer(data){if(data.conversation_state)return data.answer;return data.routing_diagnostics?.fallback_reason?'Chưa có câu trả lời cho lượt này do lỗi xử lý của hệ thống; câu hỏi người dùng vẫn chưa được giải đáp.':data.answer}
function contextMeta(source,index){const rank=source.faiss_rank||index+1,parts=[`Hạng ${rank}`,source.source_code&&`Mã ${source.source_code}`,source.section_type&&`Mục ${source.section_type}`,source.faiss_score!=null&&`FAISS ${Number(source.faiss_score).toFixed(4)}`];return parts.filter(Boolean).join(' · ')}
function contextPanel(sources){const selected=(sources||[]).filter(s=>s&&s.text_content);if(!selected.length)return null;const details=document.createElement('details');details.className='contexts';details.open=true;const summary=document.createElement('summary');summary.textContent=`Top-${selected.length} context retrieval`;const list=document.createElement('div');list.className='context-list';selected.forEach((source,index)=>{const item=document.createElement('article');item.className='context';const title=document.createElement('h3');title.textContent=source.procedure_name||source.chunk_id||`Chunk ${index+1}`;const meta=document.createElement('div');meta.className='context-meta';meta.textContent=contextMeta(source,index);const content=document.createElement('pre');content.textContent=source.text_content;item.append(title,meta,content);list.append(item)});details.append(summary,list);return details}
function beginStreamingAnswers(models){
  chat.querySelector('.empty')?.remove();const wrap=document.createElement('div');wrap.className='answers';const cards={};
  for(const modelId of models){const el=document.createElement('article');el.className='answer';const title=document.createElement('h2');title.textContent=modelInfo[modelId]?.label||modelId;const body=document.createElement('div');body.textContent='Đang chuẩn bị…';el.append(title,body);wrap.append(el);cards[modelId]={el,body,received:false}}
  chat.append(wrap);chat.scrollTop=chat.scrollHeight;return cards;
}
function applyStreamEvent(event,cards,question){
  if(event.type==='model_start'&&cards[event.model_id]&&!cards[event.model_id].received)cards[event.model_id].body.textContent='Đang xử lý…';
  if(event.type==='token'&&cards[event.model_id]){const card=cards[event.model_id];if(!card.received){card.body.textContent='';card.received=true}card.body.textContent+=event.text;chat.scrollTop=chat.scrollHeight}
  if(event.type!=='model_result')return;const data=event.result,card=cards[data.model_id];if(!card)return;card.body.textContent=data.error?'Lỗi: '+data.error:data.answer;
  if(!data.error){const contexts=contextPanel(data.sources);if(contexts)card.el.append(contexts);const sources=(data.sources||[]).map(s=>s.source_code||s.source_file).filter(Boolean),meta=document.createElement('div');meta.className='meta';meta.textContent=[data.latency_s!=null?`${data.latency_s.toFixed(1)} giây`:'',routingStatus(data.routing_diagnostics),sources.length?`Nguồn: ${[...new Set(sources)].join(', ')}`:''].filter(Boolean).join(' · ');card.el.append(meta);retrievalContexts[data.model_id]=data.retrieval_context||null;clarificationContexts[data.model_id]=data.clarification_context||null;conversationStates[data.model_id]=data.conversation_state||null;histories[data.model_id].push({role:'user',content:question},{role:'assistant',content:historyAnswer(data)})}
}
async function readEvents(response,onEvent){const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});const lines=buffer.split('\n');buffer=lines.pop();for(const line of lines)if(line.trim())onEvent(JSON.parse(line));if(done)break}if(buffer.trim())onEvent(JSON.parse(buffer))}
function addAnswers(results,question){
  chat.querySelector('.empty')?.remove();const wrap=document.createElement('div');wrap.className='answers';
  for(const data of results){
    const el=document.createElement('article');el.className='answer';const title=document.createElement('h2');title.textContent=modelInfo[data.model_id]?.label||data.model_id;el.append(title);
    const text=document.createElement('div');text.textContent=data.error?'Lỗi: '+data.error:data.answer;el.append(text);
    if(!data.error){
      const contexts=contextPanel(data.sources);if(contexts)el.append(contexts);
      const sources=(data.sources||[]).map(s=>s.source_code||s.source_file).filter(Boolean),meta=document.createElement('div');meta.className='meta';
      meta.textContent=[data.latency_s!=null?`${data.latency_s.toFixed(1)} giây`:'',routingStatus(data.routing_diagnostics),sources.length?`Nguồn: ${[...new Set(sources)].join(', ')}`:''].filter(Boolean).join(' · ');el.append(meta);
      if(data.raw_routing){const details=document.createElement('details'),summary=document.createElement('summary'),raw=document.createElement('pre');summary.textContent='Chẩn đoán routing (debug)';raw.textContent=JSON.stringify(data.raw_routing,null,2);details.append(summary,raw);el.append(details)}
      retrievalContexts[data.model_id]=data.retrieval_context||null;clarificationContexts[data.model_id]=data.clarification_context||null;conversationStates[data.model_id]=data.conversation_state||null;histories[data.model_id].push({role:'user',content:question},{role:'assistant',content:historyAnswer(data)});
    }
    wrap.append(el);
  }
  chat.append(wrap);chat.scrollTop=chat.scrollHeight;
}
async function submitQuestion(question,models){
  if(button.disabled||!question)return;if(!models.length){add('Hãy chọn ít nhất một model.','bot');return}
  add(question,'user');input.value='';button.disabled=true;button.textContent='Đang sinh…';const cards=beginStreamingAnswers(models);
  try{const selectedHistories=Object.fromEntries(models.map(id=>[id,histories[id]]));
    const res=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,models,histories:selectedHistories,
      conversation_states:Object.fromEntries(models.map(id=>[id,conversationStates[id]])),
      clarification_contexts:Object.fromEntries(models.map(id=>[id,clarificationContexts[id]])),retrieval_contexts:Object.fromEntries(models.map(id=>[id,retrievalContexts[id]]))})});
    if(!res.ok){const data=await res.json();throw new Error(data.error||'Yêu cầu thất bại')}
    await readEvents(res,event=>{if(event.type==='error')throw new Error(event.error);applyStreamEvent(event,cards,question)})
  }catch(err){add('Lỗi: '+err.message,'bot')}finally{button.disabled=false;button.textContent='Gửi';input.focus()}
}
form.addEventListener('submit',e=>{e.preventDefault();submitQuestion(input.value.trim(),[...modelsEl.querySelectorAll('input:checked')].map(x=>x.value))});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
function resetConversation(){if(button.disabled)return;for(const id of Object.keys(histories)){histories[id]=[];retrievalContexts[id]=null;clarificationContexts[id]=null;conversationStates[id]=null}chat.replaceChildren();input.focus()}
document.querySelector('#new-chat').addEventListener('click',resetConversation);
loadModels();
</script></body></html>
