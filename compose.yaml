name: vigovbot

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "qwen2.5:7b"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-ollama
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${VIGOVBOT_WEB_PORT:-8001}:8000"
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src:ro
      - ./configs:/app/configs:ro
      - ./Data/vector/unified:/app/Data/vector/unified:ro
      - rag-cache:/app/outputs/rag_cache
      - ./outputs/routing:/app/outputs/routing:ro
      - huggingface-cache:/var/cache/huggingface

  web-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile
      target: web-gpu
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${VIGOVBOT_GPU_WEB_PORT:-8002}:8000"
    environment:
      PYTHONPATH: /app/src
      QLORA_ADAPTER_PATH: /app/models/qlora
    volumes:
      - ./src:/app/src:ro
      - ./configs:/app/configs:ro
      - ./Data/vector/unified:/app/Data/vector/unified:ro
      - rag-cache:/app/outputs/rag_cache
      - ./outputs/routing:/app/outputs/routing:ro
      - type: bind
        source: ${QLORA_ADAPTER_PATH:-./outputs/qlora/best_adapter}
        target: /app/models/qlora
        read_only: true
        bind:
          create_host_path: false
      - huggingface-cache:/var/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-models:
  rag-cache:
  huggingface-cache:
